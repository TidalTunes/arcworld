[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "arcworld"
version = "0.1.0"
description = "A local-first research suite for uncertainty-aware executable world models"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [{name = "ARCWorld contributors"}]
dependencies = [
  "numpy>=2.0,<3",
]

[project.optional-dependencies]
gui = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]
openai = [
  "openai>=1.0,<3",
]
arc = [
  "arc-agi>=0.9.9,<1",
]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
arcworld = "arcworld.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/arcworld"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["arcworld"]
