systems:
  schema:
    category: "single executable object-centric world model"
    mechanisms:
      - "Ground pixels into objects, variables, and relations."
      - "Maintain one editable world_model.py containing state, step, and goal logic."
      - "Append every real transition to a Timeline."
      - "Have the LLM write and revise Python."
      - "Require exact full-history run_backtest before admitting a revision."
      - "Use BFS over simulated states."
      - "Queue structured plans with commit_actions."
      - "Compare every simulated transition with reality and abort the remaining queue on mismatch."
      - "Use discriminating experiments when candidate rules predict different outcomes."
      - "Revise the ontology as well as the transition rules when needed."
    limitations:
      - "One admitted active program can encourage premature commitment."
      - "Exact pixels alone do not express partially correct mechanics."
      - "Published headline scores use conditional fallback selection."
      - "No hidden-game result has been reported."
    source_ids:
      - schema_site
      - schema_traces

  executable_world_models:
    category: "coding agent with persistent simulator and verifier"
    mechanisms:
      - "Separate world-model engine, state I/O, planner, verifier, and executor."
      - "Replay recorded attempts and test plans inside the learned model."
      - "Stop plan execution at a real/simulated mismatch."
      - "Scheduled refactoring/simplification as an informal description-length pressure."
    ablation_findings:
      - "Stronger models and reasoning effort had the most robust effect."
      - "Textual theory beat flexible executable theory in both GPT-5.5 settings."
      - "Simplification helped three of four original settings."
      - "Fixed-interface replay verification ranked first in all four settings but cost more."
      - "GPT-5.6 Sol saturated the public set, with no held-out evaluation."
    ablation_scores_percent:
      columns:
        - textual
        - flexible_executable
        - executable_with_simplification
        - fixed_interface_replay_verification
      gpt_5_4_high:
        - 34.16
        - 33.54
        - 30.60
        - 39.16
      gpt_5_4_xhigh:
        - 40.67
        - 44.72
        - 53.10
        - 53.72
      gpt_5_5_high:
        - 58.85
        - 51.16
        - 58.35
        - 65.64
      gpt_5_5_xhigh:
        - 72.51
        - 69.70
        - 73.09
        - 74.78
      gpt_5_6_sol_followup:
        xhigh:
          textual: 92.34
          fixed_interface_replay_verification: 98.97
        max:
          textual: 95.97
          fixed_interface_replay_verification: 98.77
      caveat: "All scores in this table are author-reported Public Demo results."
    security_findings:
      - "Unhardened coding-agent setups can leak game identifiers, permit web lookup, or expose a second client."
      - "Blind evaluation should hide identifiers and source, disable network, and allow only one authoritative environment connection."
    source_ids:
      - executable_world_models_paper
      - executable_world_models_ablation
      - executable_world_models_repo

  opine_world:
    category: "object-centric program synthesis with ontology-error probing"
    mechanisms:
      - "Acting agent, synthesizer, and critic."
      - "Object-centric game engine, transition function, goal predicate, and planner."
      - "Exact replay admission, double execution to reject impurity, and static goal checks."
      - "Dirichlet effect-signature rows and entropy prioritize uncertain object types and contexts."
      - "Counterexample-triggered synthesis and per-step plan validation."
    limitations:
      - "Assumes deterministic observable-Markov dynamics."
      - "Heuristic object extraction and temporal pairing."
      - "Bounded forward search."
      - "No run variance and no same-model baseline ablation."
    source_ids:
      - opine_world

  pro_long:
    category: "lossless programmatic memory"
    mechanisms:
      - "Append observations, actions, and outcomes verbatim to structured log.txt."
      - "Retrieve with grep and Python rather than a specialized memory service."
      - "Emit action queues that drain without repeated LLM calls."
      - "Interrupt queued execution on salient state or score change."
    design_lesson: >-
      Keep an immutable evidence ledger alongside compiled semantic memory; a
      lossy summary must never become the only record of an interaction.
    source_ids:
      - pro_long_paper
      - pro_long_repo

  duck:
    category: "lightweight local code-capable Kaggle agent"
    mechanisms:
      - "Qwen 3.6 27B FP8 running locally."
      - "Live Python REPL."
      - "Rendered image, raw ASCII, and region segmentation/zoom."
      - "Old-context eviction."
    empirical_note: >-
      Won Milestone 1; the team says hand-built tools hurt and improvements came
      from multimodality and the base model.
    source_ids:
      - official_milestone_1
      - tufa_duck_score

  reki:
    category: "local vision-language JSON policy"
    mechanisms:
      - "Gemma-4-31B over labeled recent frames."
      - "One to four JSON actions."
      - "Reflection approximately every ten steps."
      - "Small rare-color button click heuristic."
      - "Dead-signature cache for ineffective clicks."
      - "Legal-action constraints and JSON repair."
    source_ids:
      - official_milestone_1

  forge:
    category: "configurable local vision-language JSON policy"
    mechanisms:
      - "Gemma-4-31B, reflection memory, action repair, and guards."
      - "Optional candidate generator, arbiter, and confidence-safe actions."
    empirical_note: "The best milestone run disabled most optional machinery."
    source_ids:
      - official_milestone_1

  tell:
    category: "minimal single-conversation memory agent"
    mechanisms:
      - "Screenshot, bash, and persistent MEMORY.md."
      - "Observe, hypothesize, test, learn, and reuse loop."
    limitation: "Lossy theory summaries can compound an incorrect causal interpretation."
    source_ids:
      - tell_repo

  graph_explorer:
    category: "model-free systematic exploration"
    mechanisms:
      - "Segment visible states."
      - "Maintain a directed observed state-transition graph."
      - "Route toward untested state-action pairs."
    use_in_suite: "Low-confidence fallback and coverage baseline."
    source_ids:
      - graph_explorer_paper
      - graph_explorer_repo

  vision_continual_learning:
    category: "multimodal continual learning on public games"
    mechanisms:
      - "Images, ASCII, and Python tools."
      - "Weights carried across games and levels."
    limitation: "Uses the evaluation games for adaptation; not evidence of first-contact transfer."
    source_ids:
      - vision_continual_learning_repo

  agentica:
    category: "orchestrator with specialized subagents"
    mechanisms:
      - "Compressed textual summaries."
      - "Delegated perception, strategy, and action work."
    limitation: "Compression can lose exact counterevidence."
    empirical_note: "Reports an unverified 36.08% on Public Demo for $1,005."
    source_ids:
      - arcgentica_blog
      - arcgentica_repo

  dreamteam:
    category: "role-specialized multi-agent workspace"
    mechanisms:
      - "Separate modeling, planning, hypothesizing, probing, and routing roles."
      - "Persistent shared artifacts."
    empirical_note: >-
      Reports 38.4% on Public Demo averaged over two independent runs and 31%
      fewer environment actions than its protocol-matched comparator.
    source_ids:
      - dreamteam_paper

novelty_hypothesis:
  statement: >-
    A risk-aware, actively probed version space of executable programs with
    revisable object ontologies, layered residual prediction, and latent-state
    discovery may improve first-contact transfer over a single exact-replay
    world model.
  status: "research hypothesis; novelty and benefit not established"
  differentiation_targets:
    - "First-class persistent ensemble of replay-consistent executable hypotheses."
    - "Alternative perception and part/whole ontologies, not only alternative transition rules."
    - "Expected information gain normalized by action cost, irreversibility, and death risk."
    - "Layered pixel, object, relation, status, and residual diagnostics with exact final certification."
    - "Latent-state automaton induction when observable Markov assumptions fail."
    - "Counterexample-guided abstraction refinement and a planner portfolio."
    - "Immutable evidence provenance for every compiled rule and macro."
  prior_art_boundaries:
    - "Schema already implements the single editable simulator, replay, BFS, queued execution, mismatch abort, and ontology revision."
    - "Executable World Models already studies persistent Python models, simplification, replay verification, and plan execution."
    - "OPINE-World already claims object-centric CEGIS and Bayesian ontology-error exploration."
    - "PRO-LONG already demonstrates lossless programmatic memory and code-search retrieval."
    - "WorldCoder already established LLM-written programmatic world models constrained by interaction."
  falsification_tests:
    - "Single simulator versus executable version space on blind games."
    - "Fixed ontology versus ontology revision."
    - "Passive or coverage probing versus information-gain probing."
    - "Observable state versus latent-state induction."
    - "Mandatory executable model versus adaptive formalization."
    - "Exact-only mismatch handling versus layered diagnostics plus exact certification."
    - "Fixed BFS versus planner portfolio."
  required_success_evidence: >-
    Improvement on a blind holdout or Kaggle hidden games, or a material
    reduction in real actions at matched completion. Reproducing saturated
    Public Demo scores is not sufficient.

reporting_protocol:
  headline: "one predeclared pass@1"
  repeated_runs:
    report:
      - "all-run mean"
      - "standard deviation or confidence interval"
      - "every trajectory"
    do_not_select_silently: true
  best_of_k:
    permitted_as_secondary_statistic: true
    required_labels:
      - "k"
      - "selection unit: benchmark, game, or level"
      - "conditional or unconditional rerun"
      - "model and effort used for each run"
  metrics:
    - "benchmark score"
    - "games completed"
    - "levels completed"
    - "real environment actions"
    - "simulated states"
    - "deaths and resets"
    - "LLM calls and tokens"
    - "runtime and monetary cost"
    - "model mismatch rate"
    - "hypothesis entropy"
    - "recovery latency after mismatch"
    - "planner selected"
  hygiene:
    - "Fresh workspace and model context per game."
    - "Hide game identifiers and implementation source."
    - "Disable web and external source lookup."
    - "Use one authoritative environment connection."
    - "Separate Public Demo, synthetic blind holdout, Kaggle Public, and Kaggle Private results."
    - "Label continual-learning and public-game exposure conditions separately."

