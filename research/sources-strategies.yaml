schema_version: 1
snapshot_date: "2026-07-26"
scope: "ARC-AGI-3 interactive-agent performance, strategies, and adjacent world-model research"
companion_report: "research/landscape.md"

comparability_warning: >-
  Official Semi-Private scores, Kaggle hidden-game scores, and scores on the 25
  openly available Public Demo games measure different regimes. Public results
  also vary by model, prior exposure, number of runs, selection rule, and cost.
  They must not be combined into one ranking.

evidence_regimes:
  official_verified:
    dataset: "55 Semi-Private environments"
    authority: "ARC Prize Foundation"
    default_protocol:
      runs: 1
      runtime_cost_cap_usd: 10000
      client_side_tools: false
      web_search: false
    notes:
      - "Frontier-model evaluation, not a specialized research harness."
      - "The official policy says Public Demo is harder on average than Semi-Private and uses a ±15 percentage-point agreement band for ARC-AGI-3."
    source_ids:
      - official_policy
      - official_technical_report

  kaggle_hidden:
    dataset: "110 unseen games split between Kaggle Public and Private Leaderboards"
    authority: "Kaggle competition and ARC Prize"
    notes:
      - "Closest available evidence of first-contact system transfer."
      - "The live leaderboard required authentication and was not reproducibly captured for this snapshot."
      - "The official Milestone 1 post identifies placements but not scores; The Duck's 1.21% is the team's own report."
    source_ids:
      - kaggle_data
      - official_milestone_1
      - tufa_duck_score

  public_demo:
    dataset: "25 open Public Demo games"
    authority: "Authors or ARC Prize Community Leaderboard unless individually verified"
    notes:
      - "Appropriate for development, traces, and controlled ablations."
      - "Community ARC-AGI-3 scores are normally public-set and self-reported."
      - "Open exposure permits harness adaptation and possible model contamination."
      - "Best-of-k and conditional fallback results are not pass@1."
    source_ids:
      - official_community_leaderboard
      - official_policy

