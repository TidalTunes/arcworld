official_inconsistencies:
  - id: "scoring_level_cap"
    kind: "direct conflict"
    claims:
      - source_ids: ["official_scoring_methodology", "toolkit_scoring_v099"]
        claim: "Square H/A and cap the resulting level score at 1.15."
      - source_ids: ["kaggle_data"]
        claim: "Use min(H/A, 1)^2, which caps a level at 1.0."
    resolution: "Use pinned v0.9.9 execution behavior: cap after squaring at 1.15."

  - id: "daily_submission_limit"
    kind: "direct conflict"
    claims:
      - source_ids: ["kaggle_rules", "kaggle_live_competition_api"]
        claim: "One submission per day."
      - source_ids: ["official_kaggle_starter_repo"]
        claim: "Five submissions per day."
    resolution: "Plan for the binding/live one-per-day limit."

  - id: "new_entrant_cutoff"
    kind: "direct conflict"
    claims:
      - source_ids: ["kaggle_live_competition_api"]
        claim: "2026-10-26 11:59 UTC."
      - source_ids: ["kaggle_timeline"]
        claim: "2026-10-26 23:59 UTC."
    resolution: "Use the earlier 11:59 UTC cutoff."

  - id: "milestone_place_distribution"
    kind: "direct conflict"
    claims:
      - source_ids: ["kaggle_rules", "kaggle_prizes"]
        claim: "$25,000 / $7,500 / $5,000 for each milestone."
      - source_ids: ["arc_agi_3_track"]
        claim: "$25,000 / $10,000 / $2,500 for each milestone."
    resolution: "Use the Kaggle distribution for the Kaggle competition."

  - id: "perfect_score_bonus_distribution"
    kind: "direct conflict"
    claims:
      - source_ids: ["kaggle_rules", "kaggle_prizes"]
        claim: >-
          Conditional $700,000 pool split $350,000 / $175,000 / $70,000 /
          $70,000 / $35,000 among up to five qualifying 100% solutions.
      - source_ids: ["arc_agi_3_track"]
        claim: >-
          The first eligible 100% solution receives the $700,000 pool, with
          rollover language.
    resolution: "Use the live Kaggle rules."

  - id: "milestone_guarantee_language"
    kind: "qualification mismatch"
    claims:
      - source_ids: ["arc_agi_3_track"]
        claim: "Milestone prizes are described as guaranteed."
      - source_ids: ["kaggle_rules", "kaggle_live_competition_api"]
        claim: "Payment remains subject to eligibility, verification, and binding terms."
    resolution: "Treat every payment as conditional on the Kaggle rules."

  - id: "winner_open_source_license"
    kind: "overlapping requirements"
    claims:
      - source_ids: ["kaggle_rules"]
        claim: >-
          CC BY 4.0 is named for the winning submission, with Open Source AI
          requirements for the system/model/weights.
      - source_ids: ["arc_2026_overview"]
        claim: >-
          Submitter-authored code and methods should use CC0 or MIT-0; third-party
          dependencies must be shareable open source.
    resolution: >-
      License original code under MIT-0 or CC0 and also satisfy every Kaggle
      model, weight, artifact, and publication requirement.

  - id: "kaggle_compute_limit"
    kind: "stale official prose"
    claims:
      - source_ids: ["arc_agi_3_track"]
        claim: "Kaggle hardware limits will be announced."
      - source_ids: ["kaggle_live_competition_api", "kaggle_code_requirements"]
        claim: "CPU and GPU notebook runtimes are each limited to 540 minutes."
    resolution: "Engineer for the live nine-hour limit."

  - id: "action_budget_numbers"
    kind: "scope mismatch"
    claims:
      - source_ids: ["official_kaggle_starter_repo"]
        claim: "Starter agent defaults to MAX_ACTIONS=80."
      - source_ids: ["official_benchmarking_repo", "official_technical_report"]
        claim: "Foundation frontier-model evaluation uses ceil(5H) per level."
      - source_ids: ["kaggle_rules", "official_full_play"]
        claim: "No universal Kaggle action limit is published; GAME_OVER can be game-specific."
    resolution: >-
      Treat 80 and 5H as harness policies, not competition rules. Track accepted
      actions until the environment terminates or the agent's own risk guard stops.

  - id: "public_demo_score_reporting"
    kind: "policy drift"
    claims:
      - source_ids: ["official_technical_report"]
        claim: "The official model leaderboard would not report Public Demo results."
      - source_ids: ["official_opus_5_result"]
        claim: "A later official model result page publishes Public Demo rows/results."
    resolution: "Label the split and date for every result; do not assume the older policy persists."

  - id: "public_terminology"
    kind: "terminology trap"
    claims:
      - source_ids: ["official_available_games"]
        claim: "Public Demo refers to 25 downloadable games."
      - source_ids: ["kaggle_data"]
        claim: "Public Leaderboard refers to scores from 55 hidden games."
    resolution: "Always write 25 Public Demo, 55 hidden public-LB, or 55 private-LB."

  - id: "november_deadlines"
    kind: "separate scopes"
    claims:
      - source_ids: ["kaggle_timeline", "kaggle_live_competition_api"]
        claim: "Kaggle final deadline is 2026-11-02 23:59 UTC."
      - source_ids: ["arc_2026_overview"]
        claim: "Research/paper track date is 2026-11-08."
    resolution: "The paper-track date does not extend the Kaggle deadline."

