environment_contract:
  frame:
    maximum_width: 64
    maximum_height: 64
    cell_minimum: 0
    cell_maximum: 15
    origin: "top-left"
    response_can_contain_animation_frames: true
  states:
    - "NOT_FINISHED"
    - "WIN"
    - "GAME_OVER"
  actions:
    RESET:
      id: 0
      semantics: "start/reset; restricted to level reset in competition mode"
    ACTION1:
      id: 1
      semantics: "up"
    ACTION2:
      id: 2
      semantics: "down"
    ACTION3:
      id: 3
      semantics: "left"
    ACTION4:
      id: 4
      semantics: "right"
    ACTION5:
      id: 5
      semantics: "game-specific interaction"
    ACTION6:
      id: 6
      semantics: "coordinate interaction"
      x_range: [0, 63]
      y_range: [0, 63]
    ACTION7:
      id: 7
      semantics: "undo where supported"
  game_over_legal_action:
    - "RESET"
  source_ids:
    - "official_actions"
    - "official_full_play"
    - "official_technical_report"

competition_mode:
  mandatory_on_kaggle: true
  api_only: true
  scores_all_available_environments: true
  unplayed_environment_score: 0
  game_reset_allowed: false
  attempted_game_reset_becomes: "level reset"
  make_calls_per_environment: 1
  scorecards_per_run: 1
  in_flight_get_scorecard_allowed: false
  public_api_base: "https://three.arcprize.org"
  kaggle_gateway_base: "http://gateway:8001"
  direct_api_flow:
    - "GET /api/games"
    - "POST /api/scorecard/open"
    - "POST /api/cmd/RESET"
    - "POST /api/cmd/ACTION1..ACTION7"
    - "POST /api/scorecard/close"
  source_ids:
    - "official_competition_mode"
    - "official_full_play"
    - "official_kaggle_starter_docs"

scoring_snapshot:
  name: "Relative Human Action Efficiency"
  acronym: "RHAE"
  units_in_local_reference: "normalized 0..1"
  units_in_upstream_source: "percentage 0..100"
  level_formula: "min(1.15, (human_baseline_actions / ai_actions) ** 2)"
  incomplete_level_score: 0
  zero_action_completed_level_score: 0
  level_score_cap: 1.15
  level_weight: "1-indexed level index"
  game_weighted_efficiency: "sum(level_index * level_score) / sum(level_index)"
  game_completion_cap: >-
    sum(level_index where level_score > 0) / sum(all level indices)
  game_score: "min(game_weighted_efficiency, game_completion_cap)"
  benchmark_score: "arithmetic mean of all game scores"
  maximum_game_score: 1
  source_ids:
    - "official_scoring_methodology"
    - "toolkit_scoring_v099"

action_accounting_snapshot:
  accepted_action_1_through_7_increments_actions: true
  reset_during_active_play_increments_actions: true
  reset_during_active_play_increments_resets: true
  initial_new_play_action_count: 0
  local_reasoning_or_simulator_steps_count: false
  universal_kaggle_action_limit_published: false
  starter_default_max_actions:
    value: 80
    scope: "editable anti-loop guard, not a competition rule"
  foundation_model_evaluation_budget:
    value: "ceil(5 * human_baseline_actions) per level"
    scope: "verified frontier-model evaluation, not a Kaggle competition limit"
  source_ids:
    - "official_scoring_methodology"
    - "toolkit_scoring_v099"
    - "official_kaggle_starter_repo"
    - "official_benchmarking_repo"
    - "official_technical_report"

